service: user-service
frameworkVersion: "3"

provider:
  name: aws
  # Serverless v3 schema placeholder; resources.extensions overrides generated Lambdas to Node 22 pending authenticated v4 migration.
  runtime: nodejs20.x
  stage: dev
  region: us-east-1
  environment:
    REGION: ${self:provider.region}
    USER_TABLE: UserTable
    STUDENT_TABLE: StudentTable
    TRAINER_TABLE: TrainerTable
    SPECIALIZATION_TABLE: SpecializationTable
    BLACKLISTED_TOKENS_TABLE: BlacklistedTokensTable
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:GetItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:TransactWriteItems
          Resource:
            - arn:aws:dynamodb:${self:provider.region}:*:table/UserTable
            - arn:aws:dynamodb:${self:provider.region}:*:table/StudentTable
            - arn:aws:dynamodb:${self:provider.region}:*:table/TrainerTable
            - arn:aws:dynamodb:${self:provider.region}:*:table/SpecializationTable
            - arn:aws:dynamodb:${self:provider.region}:*:table/BlacklistedTokensTable
  httpApi:
    cors: true
    authorizers:
      customLambdaAuthorizer:
        type: request
        functionName: jwtAuthorizer
        resultTtlInSeconds: 0

custom:
  handlerPath: .build

functions:
  jwtAuthorizer:
    handler: ${self:custom.handlerPath}/index.jwtAuthorizer
    role:
      Fn::GetAtt:
        - JwtAuthorizerLambdaRole
        - Arn
    environment:
      JWT_SECRET_PARAMETER: ${param:jwtSecretParameter}
  registerUser:
    handler: ${self:custom.handlerPath}/index.registerUser
    events:
      - httpApi:
          path: /auth/register
          method: post
  loginUser:
    handler: ${self:custom.handlerPath}/index.loginUser
    role:
      Fn::GetAtt:
        - LoginLambdaRole
        - Arn
    environment:
      JWT_SECRET_PARAMETER: ${param:jwtSecretParameter}
    events:
      - httpApi:
          path: /auth/login
          method: post
  logoutUser:
    handler: ${self:custom.handlerPath}/index.logoutUser
    events:
      - httpApi:
          path: /auth/logout
          method: get
          authorizer:
            name: customLambdaAuthorizer
            type: request
  getCurrentUser:
    handler: ${self:custom.handlerPath}/index.getCurrentUser
    events:
      - httpApi:
          path: /users/me
          method: get
          authorizer:
            name: customLambdaAuthorizer
            type: request
  deleteCurrentUser:
    handler: ${self:custom.handlerPath}/index.deleteCurrentUser
    events:
      - httpApi:
          path: /users/me
          method: delete
          authorizer:
            name: customLambdaAuthorizer
            type: request
  updateCurrentUser:
    handler: ${self:custom.handlerPath}/index.updateCurrentUser
    events:
      - httpApi:
          path: /users/me
          method: put
          authorizer:
            name: customLambdaAuthorizer
            type: request
  updatePassword:
    handler: ${self:custom.handlerPath}/index.updatePassword
    events:
      - httpApi:
          path: /users/update-password
          method: put
          authorizer:
            name: customLambdaAuthorizer
            type: request

resources:
  Resources:
    JwtAuthorizerLambdaRole:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal:
                Service: lambda.amazonaws.com
              Action: sts:AssumeRole
        ManagedPolicyArns:
          - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        Policies:
          - PolicyName: JwtAuthorizerRuntimeAccess
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action: ssm:GetParameter
                  Resource:
                    Fn::Join:
                      - ""
                      - - "arn:"
                        - Ref: AWS::Partition
                        - ":ssm:"
                        - Ref: AWS::Region
                        - ":"
                        - Ref: AWS::AccountId
                        - ":parameter"
                        - ${param:jwtSecretParameter}
                - Effect: Allow
                  Action: dynamodb:GetItem
                  Resource: arn:aws:dynamodb:${self:provider.region}:*:table/BlacklistedTokensTable

    LoginLambdaRole:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal:
                Service: lambda.amazonaws.com
              Action: sts:AssumeRole
        ManagedPolicyArns:
          - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        Policies:
          - PolicyName: LoginRuntimeAccess
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action: ssm:GetParameter
                  Resource:
                    Fn::Join:
                      - ""
                      - - "arn:"
                        - Ref: AWS::Partition
                        - ":ssm:"
                        - Ref: AWS::Region
                        - ":"
                        - Ref: AWS::AccountId
                        - ":parameter"
                        - ${param:jwtSecretParameter}
                - Effect: Allow
                  Action: dynamodb:GetItem
                  Resource: arn:aws:dynamodb:${self:provider.region}:*:table/UserTable

    UserTable:
      Type: AWS::DynamoDB::Table
      UpdateReplacePolicy: Retain
      DeletionPolicy: Retain
      Properties:
        TableName: UserTable
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
          - AttributeName: email
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        BillingMode: PROVISIONED
        ProvisionedThroughput:
          ReadCapacityUnits: 1
          WriteCapacityUnits: 1
        GlobalSecondaryIndexes:
          - IndexName: email-index
            KeySchema:
              - AttributeName: email
                KeyType: HASH
            Projection:
              ProjectionType: ALL
            ProvisionedThroughput:
              ReadCapacityUnits: 1
              WriteCapacityUnits: 1

    StudentTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: StudentTable
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        BillingMode: PROVISIONED
        ProvisionedThroughput:
          ReadCapacityUnits: 1
          WriteCapacityUnits: 1
      UpdateReplacePolicy: Retain
      DeletionPolicy: Retain

    TrainerTable:
      Type: AWS::DynamoDB::Table
      UpdateReplacePolicy: Retain
      DeletionPolicy: Retain
      Properties:
        TableName: TrainerTable
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        BillingMode: PROVISIONED
        ProvisionedThroughput:
          ReadCapacityUnits: 1
          WriteCapacityUnits: 1

    SpecializationTable:
      Type: AWS::DynamoDB::Table
      UpdateReplacePolicy: Retain
      DeletionPolicy: Retain
      Properties:
        TableName: SpecializationTable
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        BillingMode: PROVISIONED
        ProvisionedThroughput:
          ReadCapacityUnits: 1
          WriteCapacityUnits: 1

    BlacklistedTokensTable:
      Type: "AWS::DynamoDB::Table"
      UpdateReplacePolicy: Retain
      DeletionPolicy: Retain
      Properties:
        TableName: "BlacklistedTokensTable"
        AttributeDefinitions:
          - AttributeName: "token"
            AttributeType: "S"
        KeySchema:
          - AttributeName: "token"
            KeyType: "HASH"
        ProvisionedThroughput:
          ReadCapacityUnits: 1
          WriteCapacityUnits: 1
        TimeToLiveSpecification:
          AttributeName: "expiresAt"
          Enabled: true

  extensions:
    JwtAuthorizerLambdaFunction:
      Properties:
        Runtime: nodejs22.x
    RegisterUserLambdaFunction:
      Properties:
        Runtime: nodejs22.x
    LoginUserLambdaFunction:
      Properties:
        Runtime: nodejs22.x
    LogoutUserLambdaFunction:
      Properties:
        Runtime: nodejs22.x
    GetCurrentUserLambdaFunction:
      Properties:
        Runtime: nodejs22.x
    DeleteCurrentUserLambdaFunction:
      Properties:
        Runtime: nodejs22.x
    UpdateCurrentUserLambdaFunction:
      Properties:
        Runtime: nodejs22.x
    UpdatePasswordLambdaFunction:
      Properties:
        Runtime: nodejs22.x

plugins:
  - serverless-offline

package:
  patterns:
    - '!**'
    - '.build/index.js'
    - '.build/package.json'
